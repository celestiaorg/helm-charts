minimum_gas_prices: ""
query_gas_limit: "0"
pruning: default
pruning_keep_recent: "0"
pruning_interval: "0"
halt_height: 0
halt_time: 0
min_retain_blocks: 0
inter_block_cache: true
index_events: []
iavl_cache_size: 781250
iavl_disable_fastnode: false
app_db_backend: ""
telemetry:
  service_name: ""
  enabled: false
  enable_hostname: false
  enable_hostname_label: false
  enable_service_label: false
  prometheus_retention_time: 0
  global_labels: []
  metrics_sink: ""
  statsd_addr: ""
  datadog_hostname: ""
api:
  enable: false
  swagger: false
  address: tcp://localhost:1317
  max_open_connections: 1000
  rpc_read_timeout: 10
  rpc_write_timeout: 0
  rpc_max_body_bytes: 1000000
  enabled_unsafe_cors: false
grpc:
  enable: false
  address: localhost:9090
  max_recv_msg_size: "268435456"
  max_send_msg_size: "268435456"
grpc_web:
  enable: false
state_sync:
  snapshot_interval: 1500
  snapshot_keep_recent: 2
streaming:
  abci:
    keys: []
    plugin: ""
    stop_node_on_err: true
mempool:
  max_txs: -1
